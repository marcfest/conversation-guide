<!DOCTYPE html>
<!-- PRESENTER VERSION of ../index.html — the card markup and base CSS must stay
     in sync with the main guide. If you edit guide content in ../index.html,
     mirror it here. Presenter-only additions are marked "presenter:". -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Conversation Guide — Presenter</title>
  <meta name="description" content="Presenter view of conversation.guide." />
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />

  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #2E2A25;
      --ink-soft: #4A4138;
      --muted: #857A6C;
      --line: #E2D9C8;
      --line-strong: #AD9C82;
      --accent: #A85638;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #FBF6EE;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.5;
      overflow: hidden; /* presenter: page never scrolls, card is scaled to fit */
    }

    /* presenter: full-viewport stage; the card is centered and scaled from JS */
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 675px;
      width: 675px;
      margin: 0 auto;
      padding: 16px 10px 14px;
      transform-origin: center center; /* presenter: scaled to fill the stage */
    }

    .frame {
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 14px 10px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 2px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.004em;
      text-wrap: balance;
    }

    .title-btn {
      appearance: none;
      background: none;
      border: none;
      padding: 4px 4px;
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- Section headings ---- */

    .section-head {
      margin: 20px 0 4px;
      font-family: var(--sans);
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0;
      text-transform: none;
      color: var(--accent);
    }

    .section-btn {
      appearance: none;
      background: none;
      border: none;
      margin: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .subline {
      margin: 0 0 10px;
      font-family: var(--sans);
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    /* ---- Question rows ---- */

    .questions {
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }

    .q-row {
      appearance: none;
      display: grid;
      grid-template-columns: 1.5em 1fr 0.9em;
      align-items: baseline;
      gap: 0 0.15em;
      width: 100%;
      margin: 0;
      padding: 13px 2px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      font-family: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .q-num {
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
    }

    .q-text {
      font-size: 1.32rem;
      font-weight: 450;
      line-height: 1.22;
      color: var(--ink);
      transition: color 0.15s;
    }

    .q-chev {
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1;
      color: #BFB2A1;
    }

    /* ---- Follow through ---- */

    .ft {
      appearance: none;
      display: block;
      width: 100%;
      margin: 14px 0 0;
      padding: 14px 15px;
      background: rgba(191, 106, 74, 0.05);
      border: none;
      border-radius: 12px;
      font-family: var(--sans);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .ft-head {
      display: block;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--muted);
    }

    .ft-line {
      display: block;
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    .ft-line + .ft-line {
      margin-top: 4px;
    }

    .ft-line strong {
      font-weight: 600;
      color: var(--ink);
    }

    /* ---- Respond ---- */

    .respond-copy {
      margin: 0 0 4px;
      font-family: var(--sans);
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    /* ---- Footer ---- */

    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      text-align: center;
    }

    footer a, footer button {
      appearance: none;
      background: none;
      border: none;
      padding: 8px 1px;
      min-height: 44px;
      display: flex;
      align-items: center;
      font-family: inherit;
      font-size: 0.75rem;
      font-style: italic;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }

    /* ================================================================
       presenter: focus engine
       One element at a time gets .focused (scales up in place, lifts);
       everything else in the card gets dimmed via .focus-mode.
       Neutral state (no .focus-mode on body) is pixel-identical to the guide.
       ================================================================ */

    /* Gradual, legible motion: long enough to track the element growing out
       of its spot and settling back into it. Shadow/background fade with the
       scale so nothing pops.
       NOTE: transitions live only on these two low-specificity rules (.dimmable
       before .step so step elements get the full list). Do not re-declare
       `transition` on any higher-specificity rule like `body.focus-mode
       .dimmable` — that silently replaces the list at the moment the class
       flips and the transform jumps instead of animating. */
    .dimmable {
      transition: opacity 0.9s ease;
    }

    .step {
      transition:
        transform 0.9s cubic-bezier(0.33, 0, 0.15, 1),
        opacity 0.9s ease,
        box-shadow 0.9s ease,
        background-color 0.9s ease,
        border-color 0.9s ease;
      transform: scale(1);
    }

    /* dim everything that isn't the focused element */
    body.focus-mode .dimmable {
      opacity: 0.3;
    }

    body:not(.focus-mode) .dimmable {
      opacity: 1;
    }

    .step.focused {
      opacity: 1 !important;
      position: relative;
      z-index: 10;
      background: #FFFDF8;
      border-radius: 12px;
      box-shadow: 0 6px 30px rgba(46, 42, 37, 0.22);
      transform: scale(var(--focus-scale, 1.6));
    }

    /* per-element focus tuning: scale + where to grow from */
    .q-row.step.focused {
      --focus-scale: 1.55;
      transform-origin: center center;
      border-bottom-color: transparent;
    }

    .listen-block.step.focused,
    .respond-block.step.focused {
      --focus-scale: 1.5;
      transform-origin: center center;
      padding: 8px 12px;
    }

    .ft.step.focused {
      --focus-scale: 1.35;
      transform-origin: center center;
    }

    .contact-step.step.focused {
      --focus-scale: 2.1;
      transform-origin: center bottom;
      padding: 6px 14px;
    }

    /* presenter: section head + subline grouped so they focus as one unit */
    .listen-block, .respond-block {
      display: block;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="stage">
  <div class="container" id="card">
    <div class="frame">
    <header class="dimmable">
      <h1><button class="title-btn" type="button">A way into a real conversation</button></h1>
    </header>

    <main>
      <div class="listen-block step dimmable" data-step="5">
        <h2 class="section-head"><button class="section-btn" type="button">First, listen</button></h2>
        <p class="subline">Ask all four questions, one at a time, before you say where you stand.</p>
      </div>

      <div class="questions">
        <button class="q-row step dimmable" type="button" data-step="1">
          <span class="q-num">1</span>
          <span class="q-text">What do you think?</span>
          <span class="q-chev" aria-hidden="true">&rsaquo;</span>
        </button>
        <button class="q-row step dimmable" type="button" data-step="2">
          <span class="q-num">2</span>
          <span class="q-text">What's shaped your thinking on that?</span>
          <span class="q-chev" aria-hidden="true">&rsaquo;</span>
        </button>
        <button class="q-row step dimmable" type="button" data-step="3">
          <span class="q-num">3</span>
          <span class="q-text">How are you feeling about it?</span>
          <span class="q-chev" aria-hidden="true">&rsaquo;</span>
        </button>
        <button class="q-row step dimmable" type="button" data-step="4">
          <span class="q-num">4</span>
          <span class="q-text">What would make it better?</span>
          <span class="q-chev" aria-hidden="true">&rsaquo;</span>
        </button>
      </div>

      <button class="ft step dimmable" type="button" data-step="7">
        <span class="ft-head">After each answer, do at least one of these</span>
        <span class="ft-line"><strong>Say it back.</strong> Put what you heard in your own words.</span>
        <span class="ft-line"><strong>Ask one more.</strong> One follow-up question, out of real curiosity.</span>
      </button>

      <div class="respond-block step dimmable" data-step="6">
        <h2 class="section-head"><button class="section-btn" type="button">Then respond</button></h2>
        <p class="respond-copy">Answer the same four yourself, shaped by what you heard.</p>
        <p class="respond-copy">After that, keep the conversation going. The questions are here if you get stuck.</p>
      </div>
    </main>
    </div>

    <footer>
      <button type="button" class="dimmable">QR</button>
      <a href="../about.html" class="dimmable">About</a>
      <a href="../contact.html" class="step contact-step dimmable" data-step="8">Contact</a>
      <a href="../privacy.html" class="dimmable">Privacy</a>
      <a href="../song.html" class="dimmable">The song</a>
      <a href="../homescreen.html" class="dimmable">Add to Home Screen</a>
    </footer>
  </div>
  </div>

  <script>
    // presenter: scale the card to fill ~88% of the viewport height
    (function () {
      var card = document.getElementById('card');
      function fit() {
        card.style.transform = 'none';
        var h = card.offsetHeight;
        var w = card.offsetWidth;
        var scale = Math.min(
          (window.innerHeight * 0.92) / h,
          (window.innerWidth * 0.92) / w
        );
        card.style.transform = 'scale(' + scale + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
      fit();
    })();

    // presenter: focus engine
    (function () {
      var ORDER = [1, 2, 3, 4, 5, 6, 7, 8]; // narration order (Segment 3)
      var steps = {};
      document.querySelectorAll('[data-step]').forEach(function (el) {
        steps[el.dataset.step] = el;
      });

      var pos = -1; // index into ORDER; -1 = neutral

      function render() {
        document.querySelectorAll('.step.focused').forEach(function (el) {
          el.classList.remove('focused');
        });
        if (pos === -1) {
          document.body.classList.remove('focus-mode');
          return;
        }
        document.body.classList.add('focus-mode');
        var el = steps[ORDER[pos]];
        if (el) el.classList.add('focused');
      }

      function goTo(p) {
        pos = Math.max(-1, Math.min(p, ORDER.length - 1));
        render();
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          goTo(pos + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          goTo(pos - 1);
        } else if (e.key === 'Escape' || e.key === '0') {
          goTo(-1);
        } else if (e.key >= '1' && e.key <= '8') {
          goTo(ORDER.indexOf(parseInt(e.key, 10)));
        }
      });

      // Clicking an element focuses it; clicking anywhere else returns to neutral.
      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-step]');
        if (el) {
          e.preventDefault();
          goTo(ORDER.indexOf(parseInt(el.dataset.step, 10)));
        } else {
          goTo(-1);
        }
      });
    })();

    // Unregister any existing service workers (dev mode, site-wide policy)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
  </script>
</body>
</html>
